name: Update GTA 6 feed
on:
  schedule:
    # Every hour, at 7 minutes past (GitHub may delay scheduled runs a few minutes).
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: update-feed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect headlines and sources
        run: node scripts/update-feed.mjs
      - name: Commit changes (triggers a Vercel deploy)
        run: |
          if git diff --quiet -- content/feed; then
            echo "No new items."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/feed
          git commit -m "chore(feed): hourly GTA 6 update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
